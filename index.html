<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lehrerkarten Tauschbörse</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mut:#6b6a65;--br:#ddd9cf;--ac:#2a5bd7;--sp:#b8860b;--ok:#1d7a46}
@media (prefers-color-scheme:dark){:root{--bg:#171717;--card:#222;--tx:#eee;--mut:#9a9a94;--br:#383838;--ac:#7aa2ff;--sp:#e6b422;--ok:#4cc38a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;padding:16px;max-width:820px;margin:auto}
h1{font-size:1.4rem;margin:8px 0 12px}
input,select,textarea,button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--br);border-radius:8px;padding:8px 10px}
input,select,textarea{width:100%;margin-bottom:8px}
button{cursor:pointer}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.row{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--br);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.nr{font-weight:700;min-width:64px;color:var(--ac)}.nm{flex:1}.tag{font-size:.75rem;border:1px solid var(--br);border-radius:99px;padding:2px 8px;color:var(--mut)}
.tag.s{color:var(--sp);border-color:var(--sp)}.mut{color:var(--mut);font-size:.9rem}
#dot{position:fixed;right:6px;bottom:6px;width:18px;height:18px;padding:0;border-radius:50%;opacity:.3}#sf{display:grid;gap:0 8px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
#bar{position:fixed;left:0;right:0;top:0;background:var(--ok);color:#fff;padding:6px 12px;font-size:.9rem;display:none;justify-content:space-between}
#bar button{padding:2px 8px}
#ov{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:12px}
#md{background:var(--bg);border-radius:12px;max-width:760px;width:100%;max-height:90vh;overflow:auto;padding:16px}
.bid{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--br)}
.table-wrap{overflow-x:auto;margin:10px 0;border:1px solid var(--br);border-radius:8px;background:var(--card)}
.offer-table{border-collapse:collapse;width:100%;font-size:.85rem}.offer-table td.wt{min-width:130px}
.offer-table th,.offer-table td{padding:8px;border-bottom:1px solid var(--br);text-align:left;vertical-align:top}
.offer-table th{background:var(--bg);white-space:nowrap}
.offer-table tr:last-child td{border-bottom:0}
.offer-table tbody tr{cursor:pointer}.offer-table tbody tr.sel td{background:color-mix(in srgb,var(--ac) 14%,transparent)}.offer-table tbody tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--ac)}
.offer-actions{display:flex;gap:5px;flex-wrap:wrap}.offer-actions button{padding:5px 8px;font-size:.82rem}
#ub{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px;font-size:.9rem}
.note{background:var(--ok);color:#fff;border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;justify-content:space-between;align-items:center}.note button{color:#fff;background:transparent;border-color:#fff;padding:2px 10px}
body.adm{padding-top:46px}.dl{background:var(--card);border:1px solid var(--br);border-radius:10px;padding:10px 12px;margin-bottom:8px}.dl label{display:flex;gap:8px;align-items:center;margin-top:4px}.dl input{width:auto;margin:0}h2.sec{font-size:1.1rem;margin:16px 0 8px}#plus{display:none;width:100%;margin-bottom:10px}
</style>
</head>
<body>
<div id="bar"><span>Admin: <button onclick="setView('cards')">Karten</button> <button onclick="setView('deals')">Übergaben</button> <button onclick="setView('accounts')">Konten</button></span><button onclick="logout()">Beenden</button></div>
<h1>🃏 Lehrerkarten Tauschbörse</h1>
<div id="ub"></div>
<div id="nt"></div>
<button id="plus" class="p" onclick="openForm()">＋ Karte eintragen</button>
<div id="sf">
<input id="qn" placeholder="Suche nach Kartennummer (z. B. 005)" oninput="render()">
<input id="qm" placeholder="Suche nach Kartenname (z. B. Herr Schmidt)" oninput="render()">
<input id="qw" placeholder="Wer tauscht gegen … (z. B. Frau Meyer)" oninput="render()">
</div>
<div id="list"></div>
<button id="dot" title="" onclick="login()"></button>
<div id="ov" onclick="if(event.target===this)closeM()"><div id="md"></div></div>
<script>
// ===== Einstellungen =====
const CFG={owner:'jpj2012',repo:'Lehrerkarten-Traidmarket-',branch:'main',file:'data.json',bidToken:''}; // owner leer = Testmodus (nur Browser)
const CODE='ghg787tjc1215';
const START={normal:0.60,special:0.80};
const MODE={money:'Nur Geld',cards:'Nur Tausch',both:'Geld oder Tausch'};
let db={cards:[]},admin=false,view='cards',loaded=false,formOwner='';
let me=null;try{me=JSON.parse(localStorage.getItem('lk_me')||'null')}catch(e){}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur=n=>Number(n).toFixed(2).replace('.',',')+' €';
const remote=()=>!!CFG.owner;
const tok=()=>localStorage.getItem('lk_token')||CFG.bidToken;
const api=()=>`https://api.github.com/repos/${CFG.owner}/${CFG.repo}/contents/${CFG.file}`;
const hdr=()=>{const h={Accept:'application/vnd.github+json'};if(tok())h.Authorization='Bearer '+tok();return h};
const dec=b=>new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\n/g,'')),c=>c.charCodeAt(0)));
const enc=s=>{let b='';new TextEncoder().encode(s).forEach(c=>b+=String.fromCharCode(c));return btoa(b)};

async function fetchRemote(){
  let r=await fetch(api()+'?ref='+CFG.branch+'&t='+Date.now(),{headers:hdr()});
  if(r.status===401){localStorage.removeItem('lk_token');r=await fetch(api()+'?ref='+CFG.branch+'&t='+Date.now(),{headers:{Accept:'application/vnd.github+json'}})}
  if(r.status===404)return{data:{cards:[]},sha:null};
  if(!r.ok)throw new Error('GitHub '+r.status);
  const j=await r.json();return{data:JSON.parse(dec(j.content)),sha:j.sha};
}
async function load(){
  try{
    if(remote())db=(await fetchRemote()).data;
    else db=JSON.parse(localStorage.getItem('lk_db')||'{"cards":[]}');
  }catch(e){$('list').innerHTML='<p class="mut">Konnte Daten nicht laden: '+esc(e.message)+'</p>';return}
  loaded=true;render();
}
async function mutate(fn,tries=2){
  try{
    if(!remote()){const d=JSON.parse(localStorage.getItem('lk_db')||'{"cards":[]}');fn(d);localStorage.setItem('lk_db',JSON.stringify(d));db=d;render();return true}
    if(!tok()){alert('Kein gültiges GitHub-Token hinterlegt. Bitte neu einloggen.');return false}
    const {data,sha}=await fetchRemote();fn(data);
    const body={message:'Update '+new Date().toISOString(),content:enc(JSON.stringify(data,null,1)),branch:CFG.branch};
    if(sha)body.sha=sha;
    const r=await fetch(api(),{method:'PUT',headers:hdr(),body:JSON.stringify(body)});
    if(r.status===409&&tries>0)return mutate(fn,tries-1);
    if(r.status===401){localStorage.removeItem('lk_token');throw new Error('Token ungültig (401). Bitte Admin-Login wiederholen und ein neues Token eingeben.')}
    if(!r.ok)throw new Error('Speichern fehlgeschlagen ('+r.status+')');
    db=data;render();return true;
  }catch(e){alert(e.message);return false}
}

function cardGroups(cards){
  const groups=new Map();
  for(const c of cards){
    const key=String(c.name||'').trim().toLocaleLowerCase('de');
    if(!groups.has(key))groups.set(key,[]);
    groups.get(key).push(c);
  }
  return [...groups.entries()].map(([key,offers])=>({key,offers}));
}
function render(){
  renderUser();
  const sp=admin&&(view==='deals'||view==='accounts'||view.startsWith('acc:'));
  $('sf').style.display=sp?'none':'';$('plus').style.display=(admin&&!sp)?'block':'none';
  if(admin&&view==='deals')return renderDeals();
  if(admin&&view==='accounts')return renderAccounts();
  if(admin&&view.startsWith('acc:'))return renderAccount(view.slice(4));
  const n=$('qn').value.trim().toLowerCase(),m=$('qm').value.trim().toLowerCase(),w=$('qw').value.trim().toLowerCase();
  const filtered=db.cards.filter(c=>(!n||String(c.nr).toLowerCase().includes(n))
    &&(!m||String(c.name).toLowerCase().includes(m))
    &&(!w||(c.wants||[]).some(x=>x.toLowerCase().includes(w))));
  const groups=cardGroups(filtered).map(g=>({...g,min:Math.min(...g.offers.map(c=>parseInt(c.nr,10)||1e9))}))
    .sort((x,y)=>x.min-y.min||String(x.offers[0].name).localeCompare(String(y.offers[0].name),'de'));
  $('list').innerHTML=groups.length?groups.map(g=>{
    const editions=[...new Set(g.offers.map(c=>c.edition==='special'?'Special':'Normal'))];
    const editionLabel=editions.length===2?'Normal & Special':editions[0];
    const qty=g.offers.reduce((sum,c)=>sum+(Number(c.qty)||0),0);
    const modes=[...new Set(g.offers.map(c=>c.mode))];
    const nrs=[...new Set(g.offers.map(c=>String(c.nr)))].sort((p,q)=>p.localeCompare(q,'de',{numeric:true})).map(x=>'#'+esc(x)).join(', ');
    return `<div class="row" onclick="detailGroup('${encodeURIComponent(g.key)}')">
      <span class="nr">${nrs}</span>
      <span class="nm"><b>${esc(g.offers[0].name)}</b></span>
      <span class="tag">${esc(editionLabel)}</span>
      <span class="tag">${g.offers.length} Angebot${g.offers.length===1?'':'e'}</span>
      <span class="tag">×${qty}</span>
      <span class="tag">${modes.length===1?MODE[modes[0]]:'Verschiedene Angebote'}</span></div>`;
  }).join(''):'<p class="mut">Keine Karten gefunden.</p>';
}
function openM(h){$('md').innerHTML=h;$('ov').style.display='flex'}
function closeM(){$('ov').style.display='none'}
const find=id=>db.cards.find(c=>c.id===id);
const gkey=c=>encodeURIComponent(String(c.name||'').trim().toLocaleLowerCase('de'));

let selId=null;
function selOffer(id){
  selId=id;
  document.querySelectorAll('.offer-table tbody tr').forEach(r=>r.classList.toggle('sel',r.dataset.id===id));
  const r=document.querySelector('.offer-table tbody tr[data-id="'+id+'"]');
  const bar=document.getElementById('bidbar');
  if(bar)bar.style.display=(r&&r.dataset.mode==='cards')?'none':'';
}
function bidSel(){
  if(!selId)return alert('Bitte zuerst ein Angebot in der Tabelle antippen.');
  bidForm(selId);
}
function detailGroup(encodedKey){
  const key=decodeURIComponent(encodedKey);
  const offers=db.cards.filter(c=>String(c.name||'').trim().toLocaleLowerCase('de')===key)
    .sort((a,b)=>String(a.nr).localeCompare(String(b.nr),'de',{numeric:true})||String(a.edition).localeCompare(String(b.edition)));
  if(!offers.length)return;
  let h=`<h2>${esc(offers[0].name)}</h2>
    <p class="mut">${offers.length} einzelne Angebote zu dieser Karte. Jedes Angebot hat eigene Nummer, Edition, Gebote und Tauschwünsche.</p>
    <div class="table-wrap"><table class="offer-table"><thead><tr>
    <th>Nummer</th><th>Name</th><th>Edition</th><th>Preis</th><th>Höchstpreis</th><th>Tausch gegen</th>${admin?'<th>Aktion</th>':''}
    </tr></thead><tbody>`;
  for(const c of offers){
    const bids=[...(c.bids||[])].sort((a,b)=>b.price-a.price);
    const start=START[c.edition]??START.normal;
    const hasMoney=c.mode!=='cards',hasSwap=c.mode!=='money';
    const highest=hasMoney&&bids.length?eur(bids[0].price):'—';
    const wants=(c.wants||[]).length?c.wants.map(esc).join('<br>'):(hasSwap?'Keine Angabe':'—');
    const edition=c.edition==='special'?'Special':'Normal';
    const price=hasMoney?eur(start):'—';
    let action='';
    if(admin)action+=`<button onclick="detail('${c.id}')">Gebote</button> <button onclick="tradeForm('${c.id}',-1)">Trade</button> <button onclick="openForm('${c.id}')">Bearbeiten</button>`;
    h+=`<tr data-id="${c.id}" data-mode="${c.mode}" onclick="selOffer('${c.id}')"><td>#${esc(c.nr)}</td><td>${esc(c.name)}</td><td>${edition}</td><td>${price}</td><td>${highest}</td><td class="wt">${wants}</td>${admin?`<td><div class="offer-actions" onclick="event.stopPropagation()">${action}</div></td>`:''}</tr>`;
  }
  h+=`</tbody></table></div>`;
  h+=`<p><span id="bidbar"><button class="p" onclick="bidSel()">Bieten</button></span> <button onclick="closeM()">Schließen</button></p>`;
  selId=null;
  openM(h);
}
function detail(id){
  const c=find(id);if(!c)return;
  const start=START[c.edition],bids=[...(c.bids||[])].sort((a,b)=>b.price-a.price);
  const money=c.mode!=='cards',cards=c.mode!=='money';
  let h=`<h2>#${esc(c.nr)} ${esc(c.name)}</h2>
  <p>${c.edition==='special'?'<span class="tag s">Special Edition</span>':'<span class="tag">Normal</span>'} <span class="tag">Anzahl ${c.qty}</span> <span class="tag">${MODE[c.mode]}</span></p>`;
  if(admin)h+=`<p class="mut">Verkäufer: ${esc(c.seller)}</p>`;
  h+=`<h3>Diese Karten werden dagegen getauscht</h3>`+(cards?`<p>${(c.wants||[]).length?c.wants.map(w=>`<span class="tag">${esc(w)}</span>`).join(' '):'<span class="mut">Keine Angabe</span>'}</p>`:'<p class="mut">Kein Tausch, diese Karte gibt es nur gegen Geld.</p>');
  if(money){
    h+=`<h3>Kaufen</h3><p>Startpreis ${eur(start)} · ${bids.length?'Höchstgebot '+eur(bids[0].price):'noch kein Gebot'}</p>
    <button class="p" onclick="bidForm('${id}')">Bieten</button>`;
    if(admin)h+=`<h3>Gebote</h3>`+(bids.length?bids.map((b,i)=>`<div class="bid"><span>${esc(b.name)} – <b>${eur(b.price)}</b></span><button onclick="sell('${id}',${(c.bids||[]).indexOf(b)})">Zuschlag</button></div>`).join(''):'<p class="mut">Keine Gebote</p>');
  }
  if(admin)h+=`<h3>Admin</h3><button onclick="swap('${id}')">Trade durchführen</button> <button onclick="openForm('${id}')">Bearbeiten</button> <button onclick="del('${id}')">Löschen</button>`;
  h+=`<p><button onclick="closeM()">Schließen</button></p>`;
  openM(h);
}
function bidForm(id){
  const c=find(id);
  openM(`<h3>Gebot für #${esc(c.nr)} ${esc(c.name)}</h3>
  <input id="bn" placeholder="Dein Name"><input id="bp" type="number" step="0.05" min="${START[c.edition]}" value="${START[c.edition]}">
  <button class="p" onclick="bid('${id}')">Gebot abgeben</button> <button onclick="detailGroup('${gkey(c)}')">Zurück</button>`);
}
async function bid(id){
  const name=$('bn').value.trim(),price=Math.round(parseFloat($('bp').value)*100)/100,c=find(id);
  if(!name)return alert('Bitte Namen eingeben.');
  if(c.mode==='cards')return alert('Auf dieses Angebot kann nicht geboten werden (nur Tausch).');
  if(!(price>=START[c.edition]))return alert('Mindestens '+eur(START[c.edition]));
  const k=gkey(c);
  if(await mutate(d=>{const x=d.cards.find(k=>k.id===id);if(x)(x.bids=x.bids||[]).push({name,price,ts:Date.now()})}))detailGroup(k);
}
function sell(id,i){tradeForm(id,i)}
function swap(id){tradeForm(id,-1)}
function tradeForm(id,i){
  const c=find(id),b=i>=0?c.bids[i]:null;
  const types=(c.mode==='cards'?'':'<option value="money">Geld</option>')+(c.mode==='money'?'':'<option value="card">Karte</option>');
  openM(`<h3>Trade: #${esc(c.nr)} ${esc(c.name)}</h3>
  <p class="mut">Verkäufer: ${esc(c.seller)}</p>
  <input id="tw" list="tl" placeholder="Wer erhält die Karte?" value="${esc(b?b.name:'')}">
  <datalist id="tl">${[...new Set((c.bids||[]).map(x=>x.name))].map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
  <p class="mut">Was bekommt der Verkäufer dafür?</p>
  <select id="tt" onchange="tradeValueFields()">${types}</select>
  <div id="tradeValueFields">${c.mode==='cards'?'<input id="tvn" placeholder="Kartennummer (z. B. 012)"><input id="tvm" placeholder="Kartenname (z. B. Frau Meyer)">':`<input id="tv" placeholder="Betrag in €" value="${b?b.price:START[c.edition]}">`}</div>
  <button class="p" onclick="doTrade('${id}',${i})">Trade abschließen</button> <button onclick="detail('${id}')">Zurück</button>`);
}
function tradeValueFields(){
  const type=$('tt').value,box=$('tradeValueFields');
  if(type==='card')box.innerHTML='<input id="tvn" placeholder="Kartennummer (z. B. 012)"><input id="tvm" placeholder="Kartenname (z. B. Frau Meyer)">';
  else box.innerHTML='<input id="tv" type="number" step="0.01" min="0.01" placeholder="Betrag in €">';
}
function doTrade(id,i){
  const who=$('tw').value.trim(),type=$('tt').value;let val='';
  if(!who)return alert('Bitte Empfänger eingeben.');
  if(type==='money'){
    val=$('tv').value.trim();
    val=Math.round(parseFloat(val.replace(',','.'))*100)/100;
    if(!(val>0))return alert('Ungültiger Betrag.');
  }else{
    const nr=$('tvn').value.trim(),name=$('tvm').value.trim();
    if(!nr||!name)return alert('Bitte Kartennummer und Kartenname eingeben.');
    val=nr+' '+name;
  }
  mutate(d=>{
    const x=d.cards.find(k=>k.id===id);if(!x)return;
    (d.deals=d.deals||[]).push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),ts:Date.now(),nr:x.nr,name:x.name,seller:x.seller||'(unbekannt)',who,type,val,sDone:false,rDone:false});
    const ownerId=x.ownerId||((d.users||[]).find(u=>normName(u.name)===normName(x.seller))||{}).id;
    if(ownerId)(d.notes=d.notes||[]).push({id:uid(),userId:ownerId,ts:Date.now(),text:`Trade! Deine Karte #${x.nr} ${x.name} wurde an ${who} getradet. Du bekommst: ${type==='money'?eur(val):'Karte '+val}.`});
    if(i>=0&&x.bids)x.bids.splice(i,1);
    x.qty--;if(x.qty<=0)d.cards=d.cards.filter(k=>k.id!==id);
  }).then(ok=>ok&&closeM());
}
function setView(v){view=v;render()}
function toggleDeal(id,f){mutate(d=>{const x=(d.deals||[]).find(k=>k.id===id);if(x)x[f]=!x[f]})}
function delDeal(id){if(confirm('Eintrag löschen?'))mutate(d=>{d.deals=(d.deals||[]).filter(k=>k.id!==id)})}
function renderDeals(){
  const ds=(db.deals||[]).slice().sort((a,b)=>b.ts-a.ts);
  if(!ds.length){$('list').innerHTML='<p class="mut">Noch keine Trades.</p>';return}
  const grp=k=>ds.reduce((m,d)=>((m[d[k]]=m[d[k]]||[]).push(d),m),{});
  const pay=d=>d.type==='money'?eur(d.val):'Karte: '+esc(d.val);
  let h='<h2 class="sec">Verkäufer bekommen</h2>';
  for(const [n,l] of Object.entries(grp('seller'))){
    const open=l.filter(d=>!d.sDone&&d.type==='money').reduce((a,d)=>a+d.val,0);
    h+=`<div class="dl"><b>${esc(n)}</b>${open?` <span class="tag">noch offen: ${eur(open)}</span>`:''}`+
      l.map(d=>`<label><input type="checkbox" ${d.sDone?'checked':''} onchange="toggleDeal('${d.id}','sDone')"><span>#${esc(d.nr)} ${esc(d.name)} → ${esc(d.who)} · bekommt <b>${pay(d)}</b></span></label>`).join('')+'</div>';
  }
  h+='<h2 class="sec">Empfänger bekommen</h2>';
  for(const [n,l] of Object.entries(grp('who')))
    h+=`<div class="dl"><b>${esc(n)}</b>`+l.map(d=>`<label><input type="checkbox" ${d.rDone?'checked':''} onchange="toggleDeal('${d.id}','rDone')"><span>#${esc(d.nr)} ${esc(d.name)}</span><button onclick="delDeal('${d.id}')" style="margin-left:auto;padding:0 6px">✕</button></label>`).join('')+'</div>';
  $('list').innerHTML=h;
}
function del(id){if(confirm('Eintrag komplett löschen?'))mutate(d=>{d.cards=d.cards.filter(k=>k.id!==id)}).then(()=>closeM())}

const normNr=x=>String(x||'').trim().replace(/^#/,'').replace(/^0+(?=\d)/,'').toLocaleLowerCase('de');
const normName=x=>String(x||'').trim().toLocaleLowerCase('de');
function knownList(){
  const l=[...(db.known||[]),...db.cards.map(c=>({nr:c.nr,name:c.name}))];
  return l.filter(k=>k.nr&&k.name);
}
function fillFromNr(){
  const v=normNr($('fn').value);if(!v)return;
  const k=knownList().find(k=>normNr(k.nr)===v);
  if(k)$('fm').value=k.name;
}
function fillFromName(){
  const v=normName($('fm').value);if(!v)return;
  const k=knownList().find(k=>normName(k.name)===v);
  if(k)$('fn').value=k.nr;
}
function openForm(id,ownerId){
  const c=id?find(id):{nr:'',name:'',seller:'',edition:'normal',qty:1,mode:'both',wants:[]};
  formOwner=id?(c.ownerId||''):(ownerId||'');
  const ou=formOwner?(db.users||[]).find(u=>u.id===formOwner):null;
  if(ou)c.seller=ou.name;
  const sel=(o,v)=>Object.entries(o).map(([k,t])=>`<option value="${k}"${k===v?' selected':''}>${t}</option>`).join('');
  openM(`<h3>${id?'Eintrag bearbeiten':'Karte eintragen'}</h3>
  <input id="fn" placeholder="Kartennummer (z. B. 005)" value="${esc(c.nr)}" oninput="fillFromNr()">
  <input id="fm" placeholder="Kartenname (z. B. Herr Schmidt)" value="${esc(c.name)}" oninput="fillFromName()">
  <input id="fs" placeholder="Verkäufer (nur für dich sichtbar)" value="${esc(c.seller)}"${ou?' readonly':''}>
  <select id="fe">${sel({normal:'Normal (Start 0,60 €)',special:'Special Edition (Start 0,80 €)'},c.edition)}</select>
  <input id="fq" type="number" min="1" value="${c.qty}">
  <select id="fo">${sel(MODE,c.mode)}</select>
  <textarea id="fw" rows="2" placeholder="Gesuchte Karten, mit Komma getrennt (z. B. 012 Frau Meyer, Herr Schmidt)">${esc((c.wants||[]).join(', '))}</textarea>
  <button class="p" onclick="save('${id||''}')">Speichern</button> <button onclick="closeM()">Abbrechen</button>`);
}
function save(id){
  const o={nr:$('fn').value.trim(),name:$('fm').value.trim(),seller:$('fs').value.trim(),edition:$('fe').value,
    qty:Math.max(1,parseInt($('fq').value)||1),mode:$('fo').value,wants:$('fw').value.split(',').map(s=>s.trim()).filter(Boolean)};
  if(formOwner)o.ownerId=formOwner;
  if(!o.nr||!o.name)return alert('Nummer und Name sind Pflicht.');
  mutate(d=>{
    d.known=d.known||[];
    const nk=normNr(o.nr);
    const ex=d.known.find(k=>normNr(k.nr)===nk);
    if(ex)ex.name=o.name;else d.known.push({nr:o.nr,name:o.name});
    if(id){const x=d.cards.find(k=>k.id===id);Object.assign(x,o)}
    else d.cards.push({...o,id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),bids:[]});
  }).then(ok=>ok&&closeM());
}


// ===== Konten =====
const hex=b=>[...b].map(x=>x.toString(16).padStart(2,'0')).join('');
const unhex=h=>Uint8Array.from(h.match(/../g)||[],x=>parseInt(x,16));
async function hashPw(pw,salt){
  if(!(window.crypto&&crypto.subtle))throw new Error('Dieser Browser unterstützt keine sichere Passwortprüfung (https nötig).');
  const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  const b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:unhex(salt),iterations:100000,hash:'SHA-256'},k,256);
  return hex(new Uint8Array(b));
}
function renderUser(){
  if(me&&loaded&&!(db.users||[]).some(u=>u.id===me.id)){me=null;localStorage.removeItem('lk_me')}
  $('ub').innerHTML=me?`<span>Angemeldet als <b>${esc(me.name)}</b></span> <button onclick="logoutUser()">Abmelden</button>`
    :`<button onclick="loginForm()">Anmelden</button> <button onclick="registerForm()">Konto erstellen</button>`;
  let seen=[];try{seen=JSON.parse(localStorage.getItem('lk_seen')||'[]')}catch(e){}
  const ns=me?(db.notes||[]).filter(n=>n.userId===me.id&&!seen.includes(n.id)):[];
  $('nt').innerHTML=ns.map(n=>`<div class="note"><span>🔔 ${esc(n.text)}</span><button onclick="dismissNote('${n.id}')">OK</button></div>`).join('');
}
function dismissNote(id){
  let seen=[];try{seen=JSON.parse(localStorage.getItem('lk_seen')||'[]')}catch(e){}
  seen.push(id);localStorage.setItem('lk_seen',JSON.stringify(seen.slice(-200)));renderUser();
}
function registerForm(){
  openM(`<h3>Konto erstellen</h3>
  <input id="ru" placeholder="Benutzername" autocomplete="username" maxlength="24">
  <input id="rp" type="password" placeholder="Passwort (mind. 6 Zeichen)" autocomplete="new-password">
  <input id="rp2" type="password" placeholder="Passwort wiederholen" autocomplete="new-password">
  <p class="mut">Nutze hier kein Passwort, das du auch woanders verwendest.</p>
  <button class="p" onclick="doRegister()">Konto erstellen</button> <button onclick="closeM()">Abbrechen</button>`);
}
async function doRegister(){
  const name=$('ru').value.trim(),p=$('rp').value,p2=$('rp2').value;
  if(name.length<3||name.length>24)return alert('Der Benutzername muss 3 bis 24 Zeichen lang sein.');
  if(p.length<6)return alert('Das Passwort muss mindestens 6 Zeichen lang sein.');
  if(p!==p2)return alert('Die Passwörter stimmen nicht überein.');
  let salt,hash;
  try{salt=hex(crypto.getRandomValues(new Uint8Array(16)));hash=await hashPw(p,salt)}catch(e){return alert(e.message)}
  const user={id:uid(),name,salt,hash,created:Date.now()};
  const ok=await mutate(d=>{
    d.users=d.users||[];
    if(d.users.some(u=>normName(u.name)===normName(name)))throw new Error('Dieser Benutzername ist schon vergeben.');
    d.users.push(user);
  });
  if(ok){me={id:user.id,name:user.name};localStorage.setItem('lk_me',JSON.stringify(me));closeM();render()}
}
function loginForm(){
  openM(`<h3>Anmelden</h3>
  <input id="lu" placeholder="Benutzername" autocomplete="username">
  <input id="lp" type="password" placeholder="Passwort" autocomplete="current-password">
  <button class="p" onclick="doLoginUser()">Anmelden</button> <button onclick="closeM()">Abbrechen</button>`);
}
async function doLoginUser(){
  const n=$('lu').value.trim(),p=$('lp').value;
  if(!n||!p)return alert('Bitte Benutzername und Passwort eingeben.');
  await load();
  const u=(db.users||[]).find(x=>normName(x.name)===normName(n));
  let okPw=false;
  try{okPw=!!u&&(await hashPw(p,u.salt))===u.hash}catch(e){return alert(e.message)}
  if(!okPw)return alert('Benutzername oder Passwort ist falsch.');
  me={id:u.id,name:u.name};localStorage.setItem('lk_me',JSON.stringify(me));closeM();render();
}
function logoutUser(){me=null;localStorage.removeItem('lk_me');render()}
function renderAccounts(){
  const us=(db.users||[]).slice().sort((a,b)=>a.name.localeCompare(b.name,'de'));
  $('list').innerHTML='<h2 class="sec">Konten</h2>'+(us.length?us.map(u=>{
    const n=db.cards.filter(c=>c.ownerId===u.id).length;
    return `<div class="row" onclick="setView('acc:${u.id}')"><span class="nm"><b>${esc(u.name)}</b></span><span class="tag">${n} Karte${n===1?'':'n'}</span></div>`;
  }).join(''):'<p class="mut">Noch keine Konten.</p>');
}
function renderAccount(id){
  const u=(db.users||[]).find(x=>x.id===id);
  if(!u){view='accounts';return renderAccounts()}
  const cs=db.cards.filter(c=>c.ownerId===id).sort((a,b)=>(parseInt(a.nr,10)||1e9)-(parseInt(b.nr,10)||1e9));
  $('list').innerHTML=`<p><button onclick="setView('accounts')">← Alle Konten</button></p>
  <h2 class="sec">${esc(u.name)}</h2>
  <p><button class="p" onclick="openForm(null,'${id}')">＋ Karte für ${esc(u.name)} eintragen</button> <button onclick="delUser('${id}')">Konto löschen</button></p>`
  +(cs.length?cs.map(c=>`<div class="row" onclick="detail('${c.id}')"><span class="nr">#${esc(c.nr)}</span><span class="nm"><b>${esc(c.name)}</b></span><span class="tag${c.edition==='special'?' s':''}">${c.edition==='special'?'Special':'Normal'}</span><span class="tag">×${Number(c.qty)||0}</span><span class="tag">${MODE[c.mode]||''}</span></div>`).join(''):'<p class="mut">Noch keine Karten in diesem Konto.</p>');
}
function delUser(id){
  if(!confirm('Konto wirklich löschen? Die Karten bleiben bestehen.'))return;
  mutate(d=>{d.users=(d.users||[]).filter(u=>u.id!==id);d.notes=(d.notes||[]).filter(n=>n.userId!==id)}).then(ok=>{if(ok)setView('accounts')});
}
setInterval(()=>{if(me&&!admin&&$('ov').style.display!=='flex')load()},60000);
function login(){
  if(admin)return;
  if(prompt('Code:')!==CODE)return;
  if(remote()&&!tok()){
    const t=prompt('GitHub-Token (einmalig, wird nur in diesem Browser gespeichert):');
    if(t)localStorage.setItem('lk_token',t.trim());
  }
  admin=true;document.body.classList.add('adm');$('bar').style.display='flex';render();
}
function logout(){admin=false;view='cards';document.body.classList.remove('adm');$('bar').style.display='none';closeM();render()}
load();
</script>
