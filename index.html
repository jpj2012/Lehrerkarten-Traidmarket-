<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lehrerkarten Tauschbörse</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mut:#6b6a65;--br:#ddd9cf;--ac:#2a5bd7;--sp:#b8860b;--ok:#1d7a46}
@media (prefers-color-scheme:dark){:root{--bg:#171717;--card:#222;--tx:#eee;--mut:#9a9a94;--br:#383838;--ac:#7aa2ff;--sp:#e6b422;--ok:#4cc38a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;padding:16px;max-width:820px;margin:auto}
h1{font-size:1.4rem;margin:8px 0 12px}
input,select,textarea,button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--br);border-radius:8px;padding:8px 10px}
input,select,textarea{width:100%;margin-bottom:8px}
button{cursor:pointer}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.row{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--br);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.nr{font-weight:700;min-width:48px}.nm{flex:1}.tag{font-size:.75rem;border:1px solid var(--br);border-radius:99px;padding:2px 8px;color:var(--mut)}
.tag.s{color:var(--sp);border-color:var(--sp)}.mut{color:var(--mut);font-size:.9rem}
#dot{position:fixed;right:6px;bottom:6px;width:18px;height:18px;padding:0;border-radius:50%;opacity:.3}#sf{display:grid;gap:0 8px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
#bar{position:fixed;left:0;right:0;top:0;background:var(--ok);color:#fff;padding:6px 12px;font-size:.9rem;display:none;justify-content:space-between}
#bar button{padding:2px 8px}
#ov{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:12px}
#md{background:var(--bg);border-radius:12px;max-width:520px;width:100%;max-height:90vh;overflow:auto;padding:16px}
.bid{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--br)}
#plus{display:none;width:100%;margin-bottom:10px}
</style>
</head>
<body>
<div id="bar"><span>Admin-Modus</span><button onclick="logout()">Beenden</button></div>
<h1>🃏 Lehrerkarten Tauschbörse</h1>
<button id="plus" class="p" onclick="openForm()">＋ Karte eintragen</button>
<div id="sf">
<input id="qn" placeholder="Suche nach Kartennummer (z. B. 005)" oninput="render()">
<input id="qm" placeholder="Suche nach Kartenname (z. B. Herr Schmidt)" oninput="render()">
<input id="qw" placeholder="Wer tauscht gegen … (z. B. Frau Meyer)" oninput="render()">
</div>
<div id="list"></div>
<button id="dot" title="" onclick="login()"></button>
<div id="ov" onclick="if(event.target===this)closeM()"><div id="md"></div></div>
<script>
// ===== Einstellungen =====
const CFG={owner:'jpj2012',repo:'lehrerkarten',branch:'main',file:'data.json',bidToken:''}; // owner leer = Testmodus (nur Browser)
const CODE='ghg787tjc1215';
const START={normal:0.60,special:0.80};
const MODE={money:'Nur Geld',cards:'Nur Tausch',both:'Geld oder Tausch'};
let db={cards:[]},admin=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur=n=>Number(n).toFixed(2).replace('.',',')+' €';
const remote=()=>!!CFG.owner;
const tok=()=>localStorage.getItem('lk_token')||CFG.bidToken;
const api=()=>`https://api.github.com/repos/${CFG.owner}/${CFG.repo}/contents/${CFG.file}`;
const hdr=()=>{const h={Accept:'application/vnd.github+json'};if(tok())h.Authorization='Bearer '+tok();return h};
const dec=b=>new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\n/g,'')),c=>c.charCodeAt(0)));
const enc=s=>{let b='';new TextEncoder().encode(s).forEach(c=>b+=String.fromCharCode(c));return btoa(b)};

async function fetchRemote(){
  let r=await fetch(api()+'?ref='+CFG.branch+'&t='+Date.now(),{headers:hdr()});
  if(r.status===401){localStorage.removeItem('lk_token');r=await fetch(api()+'?ref='+CFG.branch+'&t='+Date.now(),{headers:{Accept:'application/vnd.github+json'}})}
  if(r.status===404)return{data:{cards:[]},sha:null};
  if(!r.ok)throw new Error('GitHub '+r.status);
  const j=await r.json();return{data:JSON.parse(dec(j.content)),sha:j.sha};
}
async function load(){
  try{
    if(remote())db=(await fetchRemote()).data;
    else db=JSON.parse(localStorage.getItem('lk_db')||'{"cards":[]}');
  }catch(e){$('list').innerHTML='<p class="mut">Konnte Daten nicht laden: '+esc(e.message)+'</p>';return}
  render();
}
async function mutate(fn,tries=2){
  try{
    if(!remote()){const d=JSON.parse(localStorage.getItem('lk_db')||'{"cards":[]}');fn(d);localStorage.setItem('lk_db',JSON.stringify(d));db=d;render();return true}
    if(!tok()){alert('Kein gültiges GitHub-Token hinterlegt. Bitte neu einloggen.');return false}
    const {data,sha}=await fetchRemote();fn(data);
    const body={message:'Update '+new Date().toISOString(),content:enc(JSON.stringify(data,null,1)),branch:CFG.branch};
    if(sha)body.sha=sha;
    const r=await fetch(api(),{method:'PUT',headers:hdr(),body:JSON.stringify(body)});
    if(r.status===409&&tries>0)return mutate(fn,tries-1);
    if(r.status===401){localStorage.removeItem('lk_token');throw new Error('Token ungültig (401). Bitte Admin-Login wiederholen und ein neues Token eingeben.')}
    if(!r.ok)throw new Error('Speichern fehlgeschlagen ('+r.status+')');
    db=data;render();return true;
  }catch(e){alert(e.message);return false}
}

function render(){
  const n=$('qn').value.trim().toLowerCase(),m=$('qm').value.trim().toLowerCase(),w=$('qw').value.trim().toLowerCase();
  const cs=db.cards.filter(c=>(!n||String(c.nr).toLowerCase().includes(n))
    &&(!m||String(c.name).toLowerCase().includes(m))
    &&(!w||(c.wants||[]).some(x=>x.toLowerCase().includes(w))))
    .sort((a,b)=>String(a.nr).localeCompare(String(b.nr),'de',{numeric:true}));
  $('list').innerHTML=cs.length?cs.map(c=>`<div class="row" onclick="detail('${c.id}')">
    <span class="nr">#${esc(c.nr)}</span><span class="nm">${esc(c.name)}</span>
    ${c.edition==='special'?'<span class="tag s">Special</span>':''}
    <span class="tag">×${c.qty}</span><span class="tag">${MODE[c.mode]}</span></div>`).join(''):'<p class="mut">Keine Karten gefunden.</p>';
}
function openM(h){$('md').innerHTML=h;$('ov').style.display='flex'}
function closeM(){$('ov').style.display='none'}
const find=id=>db.cards.find(c=>c.id===id);

function detail(id){
  const c=find(id);if(!c)return;
  const start=START[c.edition],bids=[...(c.bids||[])].sort((a,b)=>b.price-a.price);
  const money=c.mode!=='cards',cards=c.mode!=='money';
  let h=`<h2>#${esc(c.nr)} ${esc(c.name)}</h2>
  <p>${c.edition==='special'?'<span class="tag s">Special Edition</span>':'<span class="tag">Normal</span>'} <span class="tag">Anzahl ${c.qty}</span> <span class="tag">${MODE[c.mode]}</span></p>`;
  if(admin)h+=`<p class="mut">Verkäufer: ${esc(c.seller)}</p>`;
  h+=`<h3>Diese Karten werden dagegen getauscht</h3>`+(cards?`<p>${(c.wants||[]).length?c.wants.map(w=>`<span class="tag">${esc(w)}</span>`).join(' '):'<span class="mut">Keine Angabe</span>'}</p>`:'<p class="mut">Kein Tausch, diese Karte gibt es nur gegen Geld.</p>');
  if(money){
    h+=`<h3>Kaufen</h3><p>Startpreis ${eur(start)} · ${bids.length?'Höchstgebot '+eur(bids[0].price):'noch kein Gebot'}</p>
    <button class="p" onclick="bidForm('${id}')">Bieten</button>`;
    if(admin)h+=`<h3>Gebote</h3>`+(bids.length?bids.map((b,i)=>`<div class="bid"><span>${esc(b.name)} – <b>${eur(b.price)}</b></span><button onclick="sell('${id}',${(c.bids||[]).indexOf(b)})">Zuschlag</button></div>`).join(''):'<p class="mut">Keine Gebote</p>');
  }
  if(admin)h+=`<h3>Admin</h3><button onclick="swap('${id}')">Tausch erfolgt (−1)</button> <button onclick="openForm('${id}')">Bearbeiten</button> <button onclick="del('${id}')">Löschen</button>`;
  h+=`<p><button onclick="closeM()">Schließen</button></p>`;
  openM(h);
}
function bidForm(id){
  const c=find(id);
  openM(`<h3>Gebot für #${esc(c.nr)} ${esc(c.name)}</h3>
  <input id="bn" placeholder="Dein Name"><input id="bp" type="number" step="0.05" min="${START[c.edition]}" value="${START[c.edition]}">
  <button class="p" onclick="bid('${id}')">Gebot abgeben</button> <button onclick="detail('${id}')">Zurück</button>`);
}
async function bid(id){
  const name=$('bn').value.trim(),price=Math.round(parseFloat($('bp').value)*100)/100,c=find(id);
  if(!name)return alert('Bitte Namen eingeben.');
  if(!(price>=START[c.edition]))return alert('Mindestens '+eur(START[c.edition]));
  if(await mutate(d=>{const x=d.cards.find(k=>k.id===id);if(x)(x.bids=x.bids||[]).push({name,price,ts:Date.now()})}))detail(id);
}
function sell(id,i){
  const b=find(id).bids[i];
  if(!confirm(`Karte an ${b.name} für ${eur(b.price)} geben?`))return;
  mutate(d=>{const x=d.cards.find(k=>k.id===id);x.bids.splice(i,1);x.qty--;if(x.qty<=0)d.cards=d.cards.filter(k=>k.id!==id)}).then(()=>closeM());
}
function swap(id){
  if(!confirm('Eine Karte als getauscht austragen?'))return;
  mutate(d=>{const x=d.cards.find(k=>k.id===id);x.qty--;if(x.qty<=0)d.cards=d.cards.filter(k=>k.id!==id)}).then(()=>closeM());
}
function del(id){if(confirm('Eintrag komplett löschen?'))mutate(d=>{d.cards=d.cards.filter(k=>k.id!==id)}).then(()=>closeM())}

function openForm(id){
  const c=id?find(id):{nr:'',name:'',seller:'',edition:'normal',qty:1,mode:'both',wants:[]};
  const sel=(o,v)=>Object.entries(o).map(([k,t])=>`<option value="${k}"${k===v?' selected':''}>${t}</option>`).join('');
  openM(`<h3>${id?'Eintrag bearbeiten':'Karte eintragen'}</h3>
  <input id="fn" placeholder="Kartennummer (z. B. 005)" value="${esc(c.nr)}">
  <input id="fm" placeholder="Kartenname (z. B. Herr Schmidt)" value="${esc(c.name)}">
  <input id="fs" placeholder="Verkäufer (nur für dich sichtbar)" value="${esc(c.seller)}">
  <select id="fe">${sel({normal:'Normal (Start 0,60 €)',special:'Special Edition (Start 0,80 €)'},c.edition)}</select>
  <input id="fq" type="number" min="1" value="${c.qty}">
  <select id="fo">${sel(MODE,c.mode)}</select>
  <textarea id="fw" rows="2" placeholder="Gesuchte Karten, mit Komma getrennt (z. B. 012 Frau Meyer, Herr Schmidt)">${esc((c.wants||[]).join(', '))}</textarea>
  <button class="p" onclick="save('${id||''}')">Speichern</button> <button onclick="closeM()">Abbrechen</button>`);
}
function save(id){
  const o={nr:$('fn').value.trim(),name:$('fm').value.trim(),seller:$('fs').value.trim(),edition:$('fe').value,
    qty:Math.max(1,parseInt($('fq').value)||1),mode:$('fo').value,wants:$('fw').value.split(',').map(s=>s.trim()).filter(Boolean)};
  if(!o.nr||!o.name)return alert('Nummer und Name sind Pflicht.');
  mutate(d=>{
    if(id){const x=d.cards.find(k=>k.id===id);Object.assign(x,o)}
    else d.cards.push({...o,id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),bids:[]});
  }).then(ok=>ok&&closeM());
}

function login(){
  if(admin)return;
  if(prompt('Code:')!==CODE)return;
  if(remote()&&!tok()){
    const t=prompt('GitHub-Token (einmalig, wird nur in diesem Browser gespeichert):');
    if(t)localStorage.setItem('lk_token',t.trim());
  }
  admin=true;$('plus').style.display='block';$('bar').style.display='flex';render();
}
function logout(){admin=false;$('plus').style.display='none';$('bar').style.display='none';closeM()}
load();
</script>
</body>
</html>
